<link rel="stylesheet" href="style.css">

<body>
<div class="qa-container">
    <header class="qa-header">
        <div class="qa-logo">Q</div>
        <div>
            <h1>문서 Q&A</h1>
            <p>내부 문서 기반 질의응답 서비스</p>
        </div>
    </header>

    <!-- 질문과 답변이 계속 누적되는 영역 -->
    <main class="qa-messages" id="messages">
        <div class="qa-welcome" id="welcome">
            <h2>무엇이든 질문하세요.</h2>
            <p>등록된 문서를 검색하여 답변해 드립니다.</p>
        </div>
    </main>

    <!-- 질문 입력 영역 -->
    <form class="qa-input-panel" id="questionForm">
        <textarea
            class="qa-input"
            id="question"
            placeholder="궁금한 내용을 입력하세요..."
            rows="2"
            required
        ></textarea>

        <div class="qa-input-actions">
            <button class="qa-submit" id="submitButton" type="submit">
                질문하기 ↑
            </button>
        </div>
    </form>
</div>

<script src="app.js"></script>
</body>
