<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여행 회화 한마디</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 레이아웃: 위에 검색창과 상황 칩 고정, 가운데 문장 카드 목록, 아래 탭 3개 */
  :root{
    --bg:#f3f6f5; --surface:#ffffff; --fg:#14231f; --muted:#5b6a66; --line:#d9e1de;
    --accent:#0f6b5c; --accent-soft:#dcefea; --on-accent:#ffffff;
    --sun:#f3c56b; --sun-soft:#fdf1d8; --ok:#1f8a55; --ok-soft:#e0f3e8; --err:#c0442d; --err-soft:#fbe5e0;
    --en:"Fraunces",Georgia,"Times New Roman",serif;
    --ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --tabbar:62px;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0e1513; --surface:#16211e; --fg:#e3ece9; --muted:#93a49f; --line:#25332f;
    --accent:#4cc0a7; --accent-soft:#163029; --on-accent:#08201b;
    --sun:#e0a94a; --sun-soft:#33291a; --ok:#4fc489; --ok-soft:#153024; --err:#ff7d66; --err-soft:#3a1f1a; color-scheme:dark } }
  :root[data-theme="dark"]{
    --bg:#0e1513; --surface:#16211e; --fg:#e3ece9; --muted:#93a49f; --line:#25332f;
    --accent:#4cc0a7; --accent-soft:#163029; --on-accent:#08201b;
    --sun:#e0a94a; --sun-soft:#33291a; --ok:#4fc489; --ok-soft:#153024; --err:#ff7d66; --err-soft:#3a1f1a; color-scheme:dark }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--ko);-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  mark{background:var(--sun-soft);color:inherit;border-radius:3px;box-shadow:inset 0 -2px 0 var(--sun)}

  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:10px;
       padding-block:12px 10px;padding-inline:16px;border-bottom:1px solid var(--line)}
  .trow{display:flex;align-items:center;gap:10px}
  .trow h1{margin:0;font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow h1 span{font-family:var(--en);color:var(--accent);font-weight:600}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .lang{position:relative;flex:none;display:block}
  .lang select{-webkit-appearance:none;appearance:none;height:34px;border-radius:999px;border:1.5px solid var(--accent);background:var(--accent-soft);
               color:var(--fg);font:700 13.5px var(--ko);padding:0 30px 0 12px;max-width:150px}
  .lang svg{position:absolute;right:10px;top:50%;width:14px;height:14px;transform:translateY(-50%);pointer-events:none;color:var(--accent)}
  .card .rom{font-size:13px;color:var(--muted);font-style:italic}
  .speed{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex:none}
  .speed button{border:0;background:none;padding:5px 10px;font-size:12px;color:var(--muted)}
  .speed button.on{background:var(--accent);color:var(--on-accent);font-weight:700}
  .search{position:relative}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
  .search input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);
                font:16px var(--ko);padding:0 42px 0 40px;-webkit-appearance:none;appearance:none}
  .search input:focus{border-color:var(--accent);outline:none}
  .search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:var(--line);font-size:14px}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;white-space:nowrap}
  .chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
  .chips button small{color:var(--muted);margin-left:3px;font-variant-numeric:tabular-nums}
  .chips button.on small{color:inherit;opacity:.7}

  main{max-width:640px;margin:0 auto;padding-block:14px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom,0px));padding-inline:16px;
       display:flex;flex-direction:column;gap:10px}
  .count{font-size:13px;color:var(--muted);margin:0}
  .sec{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em;margin:8px 0 0}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 16px;display:flex;gap:10px;align-items:flex-start}
  .card .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .card .en{font:600 19px/1.3 var(--en);letter-spacing:-.005em;overflow-wrap:anywhere}
  .card .pr{font-size:13px;color:var(--accent)}
  .card .ko{font-size:14.5px}
  .card .tip{font-size:12.5px;color:var(--muted);margin-top:4px;padding-left:8px;border-left:2px solid var(--sun)}
  .card .cat{font-size:11px;color:var(--muted);margin-top:4px}
  .acts{display:flex;flex-direction:column;gap:6px;flex:none}
  .ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center}
  .ib svg{width:20px;height:20px}
  .ib.play{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .ib.play.speaking{box-shadow:0 0 0 4px var(--accent-soft)}
  .ib.fav.on{color:var(--sun);border-color:var(--sun);background:var(--sun-soft)}
  .ib.fav.on svg{fill:currentColor}

  .empty{text-align:center;color:var(--muted);padding:28px 8px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .empty b{color:var(--fg);font-size:16px}
  .sugs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .sugs button{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:5px 12px;font-size:13px}

  /* 퀴즈 */
  .qbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
  .qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .qmeta b{color:var(--fg)}
  .qk{font-size:22px;font-weight:700;line-height:1.35;text-wrap:balance}
  .qhint{font-size:13px;color:var(--muted)}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opts button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font:600 16.5px/1.35 var(--en)}
  .opts button.right{border-color:var(--ok);background:var(--ok-soft)}
  .opts button.wrong{border-color:var(--err);background:var(--err-soft)}
  .opts button:disabled{cursor:default}
  .qfoot{display:flex;gap:8px}
  .btn{flex:1;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .qscope{display:flex;gap:6px;flex-wrap:wrap}
  .qscope button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px}
  .qscope button.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}

  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
        display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs button{border:0;background:none;height:var(--tabbar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
  .tabs svg{width:22px;height:22px}
  .tabs button.on{color:var(--accent)}
  .toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
         padding:8px 14px;border-radius:999px;font-size:13px;z-index:9;max-width:90%;text-align:center}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

<header class="top" id="top">
  <div class="trow">
    <h1>여행 회화</h1>
    <label class="lang"><span class="sr">언어 선택</span>
      <select id="lang" aria-label="언어 선택">
        <option value="en">영어 English</option>
        <option value="ja">일본어 日本語</option>
        <option value="zh">중국어 中文</option>
        <option value="it">이탈리아어 Italiano</option>
        <option value="fr">프랑스어 Français</option>
      </select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>
    </label>
    <div class="speed" role="group" aria-label="읽기 속도">
      <button data-rate="0.9" class="on">보통</button><button data-rate="0.6">천천히</button>
    </div>
  </div>
  <div class="search" id="searchWrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="한국어나 영어로 검색 (예: 화장실, check in)" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="clearQ" aria-label="검색어 지우기" hidden>✕</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="view"></main>

<nav class="tabs">
  <button data-tab="list" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>표현</button>
  <button data-tab="fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>즐겨찾기</button>
  <button data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/></svg>퀴즈</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
const CATS = [

  ['shop','쇼핑'],['move','교통'],['way','길 묻기'],['tour','관광'],['help','긴급 상황'],

// 상황 | 영어 | 한글 발음 | 뜻 | 도움말

const LANGS = {

  it: { label: '이탈리아어', native: 'Italiano', tts: 'it-IT', ex: '화장실, bagno' },

};

const CATNAME = Object.fromEntries(CATS);
const P = RAW.trim().split('\n').map((l, i) => {
  const [cat, en, pr, ko, tip] = l.split('|');
  return { id: i, cat, ko, t: { en: { text: en, pr, tip: tip || '' } } };
});
for (const [lg, raw] of Object.entries(LANG_RAW)) {
  raw.trim().split('\n').forEach((l, i) => {
    const [text, pr, rom] = l.split('|');
    if (P[i]) P[i].t[lg] = { text, pr, rom: rom || '', tip: '' };
  });
}

const KEY = 'travel-english-v1';
let st = { favs: [], rate: 0.9, cat: 'all', best: 0, lang: 'en' };
try { Object.assign(st, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
if (!LANGS[st.lang]) st.lang = 'en';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const isFav = id => st.favs.includes(id);
const T = p => p.t[st.lang];

// ───────── 소리 ─────────
let voice = null;
function pickVoice() {
  voice = null;
  if (!('speechSynthesis' in window)) return;
  const code = LANGS[st.lang].tts, base = code.slice(0, 2);
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith(base));
  voice = vs.find(v => v.lang.replace('_', '-') === code && /Google|Samantha|Aria|Jenny|Kyoko|Ting|Alice|Amelie|Thomas|Natural/i.test(v.name))
    || vs.find(v => v.lang.replace('_', '-') === code) || vs[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, btn) {
  if (!('speechSynthesis' in window)) { toast('이 기기에서는 음성 읽기를 쓸 수 없어요.'); return; }
  speechSynthesis.cancel();
  if (!voice && speechSynthesis.getVoices().length) toast(`이 기기에 ${LANGS[st.lang].label} 음성이 없어 소리가 안 날 수 있어요.`);
  const u = new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g, '. '));
  u.lang = LANGS[st.lang].tts; u.rate = st.rate; if (voice) u.voice = voice;
  document.querySelectorAll('.speaking').forEach(b => b.classList.remove('speaking'));
  if (btn) { btn.classList.add('speaking'); u.onend = u.onerror = () => btn.classList.remove('speaking'); }
  speechSynthesis.speak(u);
}
let tt;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 1800); }

// 악센트·성조 부호를 떼고 비교 (é → e, ǎ → a). 한글은 NFC로 되돌려 그대로 유지
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').normalize('NFC').toLowerCase();
const norm = s => fold(s).replace(/[.,!?'’"/~()\-？！，。、]/g, ' ').replace(/\s+/g, ' ').trim();
const squash = s => norm(s).replace(/ /g, '');
function matches(p, q) {
  const t = T(p);
  const terms = norm(q).split(' ').filter(Boolean);
  const hay = norm(`${t.text} ${t.pr} ${t.rom || ''} ${p.ko} ${t.tip || ''} ${CATNAME[p.cat]}`);
  const hayS = hay.replace(/ /g, '');
  // 띄어쓰기 무시 비교는 한글 검색어에만 (예: "체크 인" ↔ "체크인")
  const ko = x => /[가-힣]/.test(x);
  return terms.every(x => hay.includes(x) || (ko(x) && hayS.includes(x))) || (ko(q) && hayS.includes(squash(q)));
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hilite(text, q) {
  const terms = norm(q).split(' ').filter(Boolean);
  if (!terms.length || !text) return esc(text || '');
  const f = fold(text);
  if (f.length !== text.length) return esc(text);
  const on = new Array(text.length).fill(false);
  for (const t of terms) { let i = f.indexOf(t); while (i >= 0) { for (let k = i; k < i + t.length; k++) on[k] = true; i = f.indexOf(t, i + 1); } }
  let out = '', open = false;
  for (let i = 0; i < text.length; i++) {
    if (on[i] && !open) { out += '<mark>'; open = true; } else if (!on[i] && open) { out += '</mark>'; open = false; }
    out += esc(text[i]);
  }
  return out + (open ? '</mark>' : '');
}

// ───────── 카드 ─────────
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const ICON_STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>';
function card(p, q = '', showCat = false) {
  const t = T(p);
  return `<article class="card" data-id="${p.id}">
    <div class="txt">
      <div class="en" lang="${st.lang}">${hilite(t.text, q)}</div>
      ${t.rom ? `<div class="rom" lang="zh-Latn">${hilite(t.rom, q)}</div>` : ''}
      <div class="pr">${hilite(t.pr, q)}</div>
      <div class="ko">${hilite(p.ko, q)}</div>
      ${t.tip ? `<div class="tip">${hilite(t.tip, q)}</div>` : ''}
      ${showCat ? `<div class="cat">${CATNAME[p.cat]}</div>` : ''}
    </div>
    <div class="acts">
      <button class="ib play" data-play aria-label="발음 듣기">${ICON_PLAY}</button>
      <button class="ib fav ${isFav(p.id) ? 'on' : ''}" data-fav aria-label="즐겨찾기" aria-pressed="${isFav(p.id)}">${ICON_STAR}</button>
    </div></article>`;
}

// ───────── 화면 ─────────
const view = document.getElementById('view'), qIn = document.getElementById('q');
let tab = 'list';

const scopeName = () => st.cat === 'all' ? '전체' : CATNAME[st.cat];
function renderChips() {
  // 검색 중이면 칩 숫자는 상황별 검색 결과 수
  const q = qIn.value.trim();
  const src = q ? P.filter(p => matches(p, q)) : P;
  const counts = {}; CATS.forEach(([id]) => counts[id] = 0); src.forEach(p => counts[p.cat]++);
  qIn.placeholder = st.cat === 'all' ? `전체에서 검색 (예: ${LANGS[st.lang].ex})` : `${CATNAME[st.cat]}에서 검색`;
  document.getElementById('chips').innerHTML =
    `<button data-cat="all" class="${st.cat === 'all' ? 'on' : ''}">전체<small>${src.length}</small></button>` +
    CATS.map(([id, name]) => `<button data-cat="${id}" class="${st.cat === id ? 'on' : ''}">${name}<small>${counts[id]}</small></button>`).join('');
}

function renderList() {
  const q = qIn.value.trim();
  document.getElementById('clearQ').hidden = !q;
  if (q) {
    const all = P.filter(p => matches(p, q));
    const hits = st.cat === 'all' ? all : all.filter(p => p.cat === st.cat);
    const widen = st.cat !== 'all' && all.length > hits.length
      ? `<div class="sugs"><button data-wide>전체에서 찾기 (${all.length}개)</button></div>` : '';
    if (!hits.length) {
      view.innerHTML = `<div class="empty"><b>${scopeName()}에서 "${esc(q)}"에 맞는 표현이 없어요</b>
        <span>${widen ? '다른 상황에는 있어요.' : '다른 낱말로 찾아보세요.'}</span>${widen ||
        `<div class="sugs">${['화장실','얼마','택시','체크인','알레르기','잃어버렸어요','where','please'].map(s => `<button data-sug="${s}">${s}</button>`).join('')}</div>`}</div>`;
      return;
    }
    view.innerHTML = `<p class="count">${scopeName()}에서 "${esc(q)}" 검색 결과 ${hits.length}개</p>` +
      hits.map(p => card(p, q, st.cat === 'all')).join('') + widen;
    return;
  }
  const cats = st.cat === 'all' ? CATS : CATS.filter(c => c[0] === st.cat);
  view.innerHTML = cats.map(([id, name]) =>
    `<h2 class="sec">${name}</h2>` + P.filter(p => p.cat === id).map(p => card(p)).join('')).join('');
}

function renderFav() {
  const list = P.filter(p => isFav(p.id));
  view.innerHTML = list.length
    ? `<p class="count">즐겨찾기 ${list.length}개 · 퀴즈에서 즐겨찾기만 골라 연습할 수 있어요</p>` + list.map(p => card(p, '', true)).join('')
    : `<div class="empty"><b>아직 즐겨찾기가 없어요</b><span>표현 카드의 별을 누르면 여기에 모여요. 여행 전에 꼭 쓸 문장을 모아 두세요.</span></div>`;
}

// 퀴즈
let quiz = { scope: 'all', cur: null, n: 0, right: 0, streak: 0 };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function pool() {
  if (quiz.scope === 'fav') return P.filter(p => isFav(p.id));
  if (quiz.scope === 'all') return P;
  return P.filter(p => p.cat === quiz.scope);
}
function nextQuestion() {
  const pl = pool();
  if (pl.length < 1) { quiz.cur = null; return; }
  let ans; do { ans = pl[Math.floor(Math.random() * pl.length)]; } while (pl.length > 1 && quiz.cur && ans.id === quiz.cur.ans.id);
  const same = shuffle(P.filter(p => p.cat === ans.cat && p.id !== ans.id));
  const other = shuffle(P.filter(p => p.cat !== ans.cat));
  const wrong = same.concat(other).slice(0, 3);
  quiz.cur = { ans, opts: shuffle([ans, ...wrong]), picked: null };
}
function renderQuiz() {
  if (!quiz.cur || !pool().some(p => p.id === quiz.cur.ans.id)) nextQuestion();
  const scopes = [['all', '전체'], ['fav', '즐겨찾기'], ...CATS];
  const head = `<div class="qscope">${scopes.map(([id, n]) => `<button data-scope="${id}" class="${quiz.scope === id ? 'on' : ''}">${n}</button>`).join('')}</div>`;
  if (!quiz.cur) {
    view.innerHTML = head + `<div class="empty"><b>즐겨찾기한 표현이 없어요</b><span>표현 탭에서 별을 눌러 문장을 모은 뒤 다시 와 주세요.</span></div>`;
    return;
  }
  const { ans, opts, picked } = quiz.cur;
  view.innerHTML = head + `<div class="qbox">
    <div class="qmeta"><span>${CATNAME[ans.cat]}</span><span>맞힘 <b>${quiz.right}</b> / ${quiz.n} · 연속 <b>${quiz.streak}</b> · 최고 ${st.best}</span></div>
    <div class="qk">${esc(ans.ko)}</div>
    <div class="qhint">${picked === null ? `이 말을 ${LANGS[st.lang].label}로 하면?` : esc(T(ans).pr)}</div>
    <div class="opts">${opts.map(o => {
      let cls = ''; if (picked !== null) { if (o.id === ans.id) cls = 'right'; else if (o.id === picked) cls = 'wrong'; }
      return `<button data-opt="${o.id}" class="${cls}" ${picked !== null ? 'disabled' : ''} lang="${st.lang}">${esc(T(o).text)}</button>`;
    }).join('')}</div>
    <div class="qfoot">${picked === null
      ? `<button class="btn" data-skip>건너뛰기</button>`
      : `<button class="btn" data-qplay>다시 듣기</button><button class="btn primary" data-next>다음 문제</button>`}</div></div>`;
}

function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.getElementById('searchWrap').hidden = tab !== 'list';
  document.getElementById('chips').hidden = tab !== 'list';
  if (tab === 'list') renderList(); else if (tab === 'fav') renderFav(); else renderQuiz();
}

// ───────── 이벤트 ─────────
view.addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) {
    const p = P[+c.dataset.id];
    const playBtn = e.target.closest('[data-play]'), favBtn = e.target.closest('[data-fav]');
    if (favBtn) {
      st.favs = isFav(p.id) ? st.favs.filter(x => x !== p.id) : [...st.favs, p.id]; save();
      favBtn.classList.toggle('on', isFav(p.id)); favBtn.setAttribute('aria-pressed', isFav(p.id));
      toast(isFav(p.id) ? '즐겨찾기에 담았어요' : '즐겨찾기에서 뺐어요');
      if (tab === 'fav') renderFav();
    } else speak(T(p).text, c.querySelector('[data-play]'));
    return;
  }
  const sug = e.target.closest('[data-sug]');
  if (sug) { qIn.value = sug.dataset.sug; renderChips(); renderList(); return; }
  if (e.target.closest('[data-wide]')) { st.cat = 'all'; save(); renderChips(); renderList(); window.scrollTo(0, 0); return; }
  const sc = e.target.closest('[data-scope]');
  if (sc) { quiz.scope = sc.dataset.scope; quiz.cur = null; renderQuiz(); return; }
  const op = e.target.closest('[data-opt]');
  if (op && quiz.cur && quiz.cur.picked === null) {
    const id = +op.dataset.opt, ok = id === quiz.cur.ans.id;
    quiz.cur.picked = id; quiz.n++;
    if (ok) { quiz.right++; quiz.streak++; if (quiz.streak > st.best) { st.best = quiz.streak; save(); } }
    else quiz.streak = 0;
    renderQuiz(); speak(T(quiz.cur.ans).text);
    return;
  }
  if (e.target.closest('[data-next]') || e.target.closest('[data-skip]')) { nextQuestion(); renderQuiz(); return; }
  if (e.target.closest('[data-qplay]')) speak(T(quiz.cur.ans).text);
});
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  st.cat = b.dataset.cat; save(); renderChips(); renderList(); window.scrollTo(0, 0);
});
qIn.addEventListener('input', () => { renderChips(); renderList(); window.scrollTo(0, 0); });
qIn.addEventListener('keydown', e => { if (e.key === 'Enter') qIn.blur(); });
document.getElementById('clearQ').onclick = () => { qIn.value = ''; renderChips(); renderList(); qIn.focus(); };
document.querySelectorAll('.speed button').forEach(b => {
  b.classList.toggle('on', +b.dataset.rate === st.rate);
  b.onclick = () => { st.rate = +b.dataset.rate; save(); document.querySelectorAll('.speed button').forEach(x => x.classList.toggle('on', x === b)); };
});
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
const langSel = document.getElementById('lang');
langSel.value = st.lang;
langSel.addEventListener('change', () => {
  st.lang = langSel.value; save(); pickVoice();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (quiz.cur) quiz.cur.picked = null;
  renderChips(); render(); window.scrollTo(0, 0);
  toast(`${LANGS[st.lang].label}로 바꿨어요`);
});

renderChips();
render();
</script>
</body>
</html>
