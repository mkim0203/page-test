<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>천자문 따라쓰기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf6ea; --paper2:#f3ead5; --ink:#1d1a16; --muted:#7a6f5d;
    --red:#b8322a; --red-soft:rgba(184,50,42,.28); --line:#e2d5b8;
    --accent:#2f5d50; --accent2:#e8f0ec; --done:#2f7d4f; --card:#fffdf7;
    --serif:"Noto Serif KR","Batang","바탕","Noto Serif CJK KR",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;display:flex;flex-direction:column}
  button{font:inherit;cursor:pointer}
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--paper2)}
  header h1{margin:0;font-family:var(--serif);font-size:22px;letter-spacing:2px;white-space:nowrap}
  header h1 span{color:var(--red)}
  .prog{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}
  .bar{flex:1;height:8px;background:#e6dcc4;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
  .prog b{font-size:13px;white-space:nowrap;color:var(--muted);font-weight:600}
  #menuBtn{display:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px}

  .layout{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
  aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
  .search{padding:10px;display:flex;gap:6px;border-bottom:1px solid var(--line)}
  .search input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit;min-width:0}
  .search select{border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit}
  #list{overflow:auto;flex:1;padding:6px}
  .ph{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}
  .ph:hover{background:var(--paper2)}
  .ph.cur{background:var(--accent2);outline:1px solid #b9d0c6}
  .ph .no{font-size:11px;color:var(--muted);width:28px;text-align:right}
  .ph .cs{font-family:var(--serif);font-size:20px;letter-spacing:2px}
  .ph .cs s{text-decoration:none}
  .ph .cs s.ok{color:var(--done)}
  .ph .rd{font-size:12px;color:var(--muted);margin-left:auto}

  main{overflow:auto;padding:18px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .strip .lbl{font-size:13px;color:var(--muted)}
  .cell{width:64px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 0 6px;text-align:center;cursor:pointer}
  .cell .c{font-family:var(--serif);font-size:30px;line-height:1.2}
  .cell .e{font-size:12px;color:var(--muted)}
  .cell.on{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
  .cell.ok .c{color:var(--done)}
  .ghost{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:13px}
  .ghost:hover{background:var(--paper2)}

  .work{display:flex;gap:20px;align-items:flex-start;justify-content:center;width:100%;max-width:1050px;flex-wrap:wrap}
  .boardCol{display:flex;flex-direction:column;gap:10px;align-items:center;flex:1 1 420px;max-width:600px}
  .board{position:relative;width:min(100%,62vh);aspect-ratio:1;border-radius:6px;box-shadow:0 2px 10px rgba(60,40,10,.12)}
  .board canvas{position:absolute;inset:0;width:100%;height:100%}
  #ink{touch-action:none;cursor:crosshair}
  .tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600}
  .btn:hover{background:var(--paper2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.1)}
  #result{min-height:28px;font-weight:700;font-size:17px;text-align:center}
  #result small{display:block;font-weight:400;font-size:13px;color:var(--muted)}

  .card{flex:0 1 300px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
  .model{text-align:center}
  .model .big{font-family:var(--serif);font-size:110px;line-height:1.15;color:var(--ink)}
  .model .big.q{color:#cbbf9f}
  .model .hun{font-size:24px;font-weight:700;margin-top:2px}
  .model .hun em{font-style:normal;color:var(--red)}
  .model .meta{font-size:12px;color:var(--muted);margin-top:4px}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{flex:1;border:0;background:transparent;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:#fff}
  .help{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
  label.row{display:flex;align-items:center;gap:8px;font-size:13px}
  label.row span{width:70px;color:var(--muted)}
  label.row input[type=range]{flex:1}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px}
  .stats{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    aside{position:fixed;inset:52px 0 0 0;z-index:10;display:none}
    aside.open{display:flex}
    #menuBtn{display:block}
    main{padding:12px 16px}
    .card{flex:1 1 100%}
    .model .big{font-size:80px}
    header h1{font-size:18px}
  }
</style>
</head>
<body>
<header>
  <button id="menuBtn">☰ 목록</button>
  <h1><span>千字文</span> 따라쓰기</h1>
  <div class="prog"><div class="bar"><i id="barFill"></i></div><b id="progTxt">0 / 1000</b></div>
</header>

<div class="layout">
  <aside id="aside">
    <div class="search">
      <input id="q" placeholder="한자·훈·음 검색 (예: 天, 하늘, 천)">
      <select id="filter">
        <option value="all">전체</option>
        <option value="todo">미완료</option>
        <option value="done">완료</option>
      </select>
    </div>
    <div id="list"></div>
  </aside>

  <main>
    <div class="strip">
      <span class="lbl" id="phNo"></span>
      <div class="strip" id="strip"></div>
      <button class="ghost" id="sayPhrase">🔊 구절 듣기</button>
    </div>

    <div class="work">
      <div class="boardCol">
        <div class="board" id="board">
          <canvas id="bg"></canvas>
          <canvas id="ink"></canvas>
        </div>
        <div class="tools">
          <button class="btn" id="prev">◀ 이전</button>
          <button class="btn" id="undo">↶ 되돌리기</button>
          <button class="btn" id="clear">지우기</button>
          <button class="btn primary" id="grade">✔ 채점하기</button>
          <button class="btn" id="next">다음 ▶</button>
        </div>
        <div id="result"></div>
      </div>

      <div class="card">
        <div class="model">
          <div class="big" id="big"></div>
          <div class="hun" id="hun"></div>
          <div class="meta" id="meta"></div>
        </div>
        <div class="tools">
          <button class="ghost" id="say">🔊 훈음 듣기</button>
          <button class="ghost" id="reveal">👁 정답 보기</button>
          <button class="ghost" id="rand">🎲 미완료 글자</button>
        </div>
        <div>
          <div class="seg" id="modes">
            <button data-m="trace" class="on">따라쓰기</button>
            <button data-m="copy">보고쓰기</button>
            <button data-m="test">외워쓰기</button>
          </div>
          <p class="help" id="modeHelp"></p>
        </div>
        <label class="row"><span>본보기 농도</span><input type="range" id="alpha" min="5" max="60" value="22"></label>
        <label class="row"><span>붓 굵기</span><input type="range" id="brush" min="2" max="9" step="0.5" value="4.5"></label>
        <label class="chk"><input type="checkbox" id="autoNext"> 70점 이상이면 자동으로 다음 글자</label>
        <p class="help">단축키: ← → 이동 · Enter 채점 · Ctrl+Z 되돌리기 · Del 지우기</p>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </main>
</div>

<script>

const CHARS = [], PHRASES = [];
RAW.trim().split('\n').forEach((line, pi) => {
  const [chars, hs] = line.split('|');
  const hus = hs.split(',');
  const start = CHARS.length;
  [...chars].forEach((ch, i) => {
    const s = hus[i].trim(), k = s.lastIndexOf(' ');
    CHARS.push({ ch, hun: s.slice(0, k), eum: s.slice(k + 1), pi, idx: CHARS.length });
  });
  PHRASES.push({ chars, start, read: CHARS.slice(start).map(c => c.eum).join('') });
});

// ───────── 상태 ─────────
const $ = s => document.querySelector(s);
const FONT = `"Noto Serif KR","Batang","바탕","BatangChe","Noto Serif CJK KR","Source Han Serif K",serif`;
const STORE = 'cheonjamun-progress-v1';
let progress = {};
try { progress = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) {}
const saveProgress = () => { try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {} };
const isDone = i => (progress[i]?.best || 0) >= 70;

let cur = 0, mode = 'trace', revealed = false, strokes = [], drawing = null;
try { cur = +localStorage.getItem(STORE + '-cur') || 0; mode = localStorage.getItem(STORE + '-mode') || 'trace'; } catch (e) {}

const bg = $('#bg'), ink = $('#ink'), bctx = bg.getContext('2d'), ictx = ink.getContext('2d');
let S = 0;

// ───────── 캔버스 ─────────
function resize() {
  S = Math.floor($('#board').getBoundingClientRect().width);
  const dpr = window.devicePixelRatio || 1;
  for (const c of [bg, ink]) {
    c.width = c.height = Math.round(S * dpr);
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  drawBg(); redrawInk();
}

function drawGlyph(ctx, ch, s, color, strokeW = 0) {
  ctx.save();
  ctx.font = `${Math.round(s * 0.8)}px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const m = ctx.measureText(ch);
  const w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
  const h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const x = (s - w) / 2 + m.actualBoundingBoxLeft;
  const y = (s - h) / 2 + m.actualBoundingBoxAscent;
  ctx.fillStyle = color; ctx.fillText(ch, x, y);
  if (strokeW) { ctx.lineWidth = strokeW; ctx.lineJoin = 'round'; ctx.strokeStyle = color; ctx.strokeText(ch, x, y); }
  ctx.restore();
}

function drawBg() {
  const c = bctx, s = S;
  c.clearRect(0, 0, s, s);
  c.fillStyle = '#fffdf6'; c.fillRect(0, 0, s, s);
  // 米字格 안내선
  c.strokeStyle = 'rgba(184,50,42,.35)'; c.lineWidth = 1; c.setLineDash([6, 6]);
  c.beginPath();
  c.moveTo(s / 2, 0); c.lineTo(s / 2, s); c.moveTo(0, s / 2); c.lineTo(s, s / 2);
  c.moveTo(0, 0); c.lineTo(s, s); c.moveTo(s, 0); c.lineTo(0, s);
  c.stroke(); c.setLineDash([]);
  c.strokeStyle = '#b8322a'; c.lineWidth = 3; c.strokeRect(1.5, 1.5, s - 3, s - 3);

  const ch = CHARS[cur].ch;
  if (revealed) drawGlyph(c, ch, s, 'rgba(200,40,40,.35)');
  else if (mode === 'trace') drawGlyph(c, ch, s, `rgba(0,0,0,${$('#alpha').value / 100})`);
}

// ───────── 붓 그리기 ─────────
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
function seg(ctx, pts, i, s, extra) {
  const a = pts[i - 1], b = pts[i];
  const pa = i > 1 ? mid(pts[i - 2], a) : a, mb = mid(a, b);
  ctx.lineWidth = a.w * s + extra;
  ctx.beginPath(); ctx.moveTo(pa.x * s, pa.y * s);
  ctx.quadraticCurveTo(a.x * s, a.y * s, mb.x * s, mb.y * s); ctx.stroke();
}
function tail(ctx, pts, s, extra) {
  const n = pts.length; if (n < 2) return;
  const a = n > 2 ? mid(pts[n - 3], pts[n - 2]) : pts[n - 2];
  const m = mid(pts[n - 2], pts[n - 1]);
  ctx.lineWidth = pts[n - 1].w * s + extra;
  ctx.beginPath(); ctx.moveTo(m.x * s, m.y * s); ctx.lineTo(pts[n - 1].x * s, pts[n - 1].y * s); ctx.stroke();
}
function dot(ctx, p, s, extra) {
  ctx.beginPath(); ctx.arc(p.x * s, p.y * s, (p.w * s + extra) / 2, 0, Math.PI * 2); ctx.fill();
}
function setInk(ctx, color) {
  ctx.strokeStyle = ctx.fillStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
}
function renderStrokes(ctx, s, extra = 0, color = '#1d1a16') {
  setInk(ctx, color);
  for (const st of strokes) {
    dot(ctx, st.pts[0], s, extra);
    for (let i = 1; i < st.pts.length; i++) seg(ctx, st.pts, i, s, extra);
    tail(ctx, st.pts, s, extra);
  }
}
function redrawInk() { ictx.clearRect(0, 0, S, S); renderStrokes(ictx, S); }

function pointOf(e, prev) {
  const r = ink.getBoundingClientRect();
  const p = { x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S, t: e.timeStamp };
  const base = $('#brush').value / 100;
  let f = 1;
  if (prev) {
    const dt = Math.max(1, p.t - prev.t);
    const v = Math.hypot(p.x - prev.x, p.y - prev.y) * S / dt; // px/ms
    f = Math.min(1.25, Math.max(0.45, 1.25 - v * 0.35));
  }
  if (e.pointerType === 'pen' && e.pressure > 0) f *= 0.4 + e.pressure * 1.2;
  const target = base * f;
  p.w = prev ? prev.w * 0.7 + target * 0.3 : base;
  return p;
}

ink.addEventListener('pointerdown', e => {
  e.preventDefault(); ink.setPointerCapture(e.pointerId);
  const p = pointOf(e);
  drawing = { pts: [p] }; strokes.push(drawing);
  setInk(ictx, '#1d1a16'); dot(ictx, p, S, 0);
});
ink.addEventListener('pointermove', e => {
  if (!drawing) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  setInk(ictx, '#1d1a16');
  for (const ev of evs.length ? evs : [e]) {
    const pts = drawing.pts, prev = pts[pts.length - 1];
    const p = pointOf(ev, prev);
    if (Math.hypot(p.x - prev.x, p.y - prev.y) * S < 1) continue;
    pts.push(p); seg(ictx, pts, pts.length - 1, S, 0);
  }
});
const endStroke = () => {
  if (!drawing) return;
  setInk(ictx, '#1d1a16'); tail(ictx, drawing.pts, S, 0);
  drawing = null;
};
ink.addEventListener('pointerup', endStroke);
ink.addEventListener('pointercancel', endStroke);

// ───────── 채점 ─────────
function mask(drawFn) {
  const N = 160, c = document.createElement('canvas');
  c.width = c.height = N;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  drawFn(ctx, N);
  const d = ctx.getImageData(0, 0, N, N).data, m = new Uint8Array(N * N);
  for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > 100 ? 1 : 0;
  return m;
}
function grade() {
  if (!strokes.length) { showResult('먼저 글자를 써 보세요.', ''); return; }
  const ch = CHARS[cur].ch, tol = 0.06;
  const G  = mask((c, N) => drawGlyph(c, ch, N, '#000'));
  const Gd = mask((c, N) => drawGlyph(c, ch, N, '#000', N * tol));
  const U  = mask((c, N) => renderStrokes(c, N, 0, '#000'));
  const Ud = mask((c, N) => renderStrokes(c, N, N * tol, '#000'));
  let g = 0, gHit = 0, u = 0, uHit = 0;
  for (let i = 0; i < G.length; i++) {
    if (G[i]) { g++; if (Ud[i]) gHit++; }
    if (U[i]) { u++; if (Gd[i]) uHit++; }
  }
  const recall = g ? gHit / g : 0, precision = u ? uHit / u : 0;
  const f1 = recall + precision ? 2 * recall * precision / (recall + precision) : 0;
  const score = Math.round(Math.min(1, f1 * 1.12) * 100);

  const rec = progress[cur] || { best: 0, tries: 0 };
  rec.tries++; rec.best = Math.max(rec.best, score); rec.last = Date.now();
  progress[cur] = rec; saveProgress();

  const msg = score >= 90 ? '🎉 훌륭해요!' : score >= 75 ? '👍 잘 썼어요!' : score >= 55 ? '🙂 조금만 더!' : '✍️ 다시 해볼까요?';
  const tip = recall < precision - 0.1 ? '빠진 획이 있어요. 본보기의 획을 모두 채워 보세요.'
            : precision < recall - 0.1 ? '획이 본보기 밖으로 많이 나갔어요. 위치와 크기를 맞춰 보세요.'
            : '획의 위치와 모양을 본보기와 비교해 보세요.';
  showResult(`${msg} ${score}점`, `획 채움 ${Math.round(recall * 100)}% · 정확도 ${Math.round(precision * 100)}% — ${tip} (최고 ${rec.best}점)`);

  revealed = true; drawBg(); renderAll();
  if ($('#autoNext').checked && score >= 70 && cur < CHARS.length - 1) setTimeout(() => go(cur + 1), 1300);
}
function showResult(a, b) { $('#result').innerHTML = a + (b ? `<small>${b}</small>` : ''); }

// ───────── 소리 ─────────
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ko'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

// ───────── 화면 갱신 ─────────
const MODE_HELP = {
  trace: '흐린 본보기 위에 그대로 따라 써 보세요.',
  copy: '오른쪽 본보기를 보면서 빈 칸에 써 보세요.',
  test: '훈과 음만 보고 기억해서 써 보세요. 채점하면 정답이 나타나요.',
};
function renderAll() {
  const c = CHARS[cur], p = PHRASES[c.pi], hide = mode === 'test' && !revealed;
  $('#phNo').textContent = `제 ${c.pi + 1}구 / 250`;
  $('#strip').innerHTML = [...p.chars].map((ch, i) => {
    const idx = p.start + i, me = idx === cur;
    return `<div class="cell ${me ? 'on' : ''} ${isDone(idx) ? 'ok' : ''}" data-i="${idx}">
      <div class="c">${me && hide ? '?' : ch}</div><div class="e">${CHARS[idx].eum}</div></div>`;
  }).join('');
  const big = $('#big');
  big.textContent = hide ? '?' : c.ch;
  big.classList.toggle('q', hide);
  $('#hun').innerHTML = `${c.hun} <em>${c.eum}</em>`;
  const r = progress[cur];
  $('#meta').textContent = `${cur + 1}번째 글자 · ${p.chars} (${p.read})` + (r ? ` · 최고 ${r.best}점 / ${r.tries}회` : '');
  $('#modes').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  $('#modeHelp').textContent = MODE_HELP[mode];
  $('#alpha').disabled = mode !== 'trace';

  const done = CHARS.filter((_, i) => isDone(i)).length;
  $('#barFill').style.width = done / 10 + '%';
  $('#progTxt').textContent = `완료 ${done} / 1000`;
  const tries = Object.values(progress).reduce((a, r) => a + r.tries, 0);
  const scores = Object.values(progress).map(r => r.best);
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
  $('#stats').textContent = `연습한 글자 ${scores.length}자 · 총 ${tries}회 채점 · 평균 최고점 ${avg}점`;
  renderList();
}

function renderList() {
  const q = $('#q').value.trim(), f = $('#filter').value;
  const html = [];
  PHRASES.forEach((p, pi) => {
    const idxs = [0, 1, 2, 3].map(i => p.start + i);
    if (q && !idxs.some(i => { const c = CHARS[i]; return c.ch === q || c.hun.includes(q) || c.eum === q; }) && !p.read.includes(q) && !p.chars.includes(q)) return;
    const dn = idxs.filter(isDone).length;
    if (f === 'done' && dn < 4) return;
    if (f === 'todo' && dn === 4) return;
    html.push(`<div class="ph ${CHARS[cur].pi === pi ? 'cur' : ''}" data-i="${p.start}">
      <span class="no">${pi + 1}</span>
      <span class="cs">${idxs.map(i => `<s class="${isDone(i) ? 'ok' : ''}" data-i="${i}">${CHARS[i].ch}</s>`).join('')}</span>
      <span class="rd">${p.read}</span></div>`);
  });
  $('#list').innerHTML = html.join('') || '<p class="help" style="padding:10px">검색 결과가 없어요.</p>';
}

function go(i) {
  cur = (i + CHARS.length) % CHARS.length;
  strokes = []; revealed = false; showResult('', '');
  try { localStorage.setItem(STORE + '-cur', cur); } catch (e) {}
  drawBg(); redrawInk(); renderAll();
  const el = $('#list .ph.cur'); if (el) el.scrollIntoView({ block: 'nearest' });
  // 웹폰트가 늦게 받아지면 본보기를 다시 그림
  if (document.fonts) document.fonts.load(`40px "Noto Serif KR"`, CHARS[cur].ch).then(drawBg).catch(() => {});
}

// ───────── 이벤트 ─────────
$('#prev').onclick = () => go(cur - 1);
$('#next').onclick = () => go(cur + 1);
$('#undo').onclick = () => { strokes.pop(); redrawInk(); };
$('#clear').onclick = () => { strokes = []; redrawInk(); showResult('', ''); };
$('#grade').onclick = grade;
$('#say').onclick = () => speak(`${CHARS[cur].hun} ${CHARS[cur].eum}`);
$('#sayPhrase').onclick = () => { const p = PHRASES[CHARS[cur].pi]; speak(p.read + '. ' + [0,1,2,3].map(i => { const c = CHARS[p.start + i]; return `${c.hun} ${c.eum}`; }).join(', ')); };
$('#reveal').onclick = () => { revealed = !revealed; drawBg(); renderAll(); };
$('#rand').onclick = () => {
  const todo = CHARS.map((_, i) => i).filter(i => !isDone(i));
  if (!todo.length) { showResult('🏆 천 글자를 모두 완료했어요!', ''); return; }
  go(todo[Math.floor(Math.random() * todo.length)]);
};
$('#modes').onclick = e => {
  const m = e.target.dataset.m; if (!m) return;
  mode = m; revealed = false;
  try { localStorage.setItem(STORE + '-mode', mode); } catch (err) {}
  drawBg(); renderAll();
};
$('#alpha').oninput = drawBg;
$('#strip').onclick = e => { const el = e.target.closest('[data-i]'); if (el) go(+el.dataset.i); };
$('#list').onclick = e => {
  const el = e.target.closest('[data-i]'); if (!el) return;
  go(+el.dataset.i); $('#aside').classList.remove('open');
};
$('#q').oninput = renderList;
$('#filter').onchange = renderList;
$('#menuBtn').onclick = () => $('#aside').classList.toggle('open');

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft') go(cur - 1);
  else if (e.key === 'ArrowRight') go(cur + 1);
  else if (e.key === 'Enter') { e.preventDefault(); grade(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); strokes.pop(); redrawInk(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { strokes = []; redrawInk(); showResult('', ''); }
});

new ResizeObserver(resize).observe($('#board'));
if ('speechSynthesis' in window) speechSynthesis.getVoices();
go(cur);
</script>
</body>
</html>
